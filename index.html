<button id="start">開始</button>
<script>
  document.getElementById("start").onclick = async () => {
    this.disabled = true;
    await DeviceMotionEvent.requestPermission?.();
    let down = false;
    addEventListener("devicemotion", (e) => {
      const z = e.accelerationIncludingGravity?.z;
      if (z < -8) down = true;
      if (down && z > -6) {
        down = false;
        alert("持ち上げた");
      }
    });
  };
</script>
